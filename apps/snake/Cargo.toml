# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "pbr-snake-app"
description = "Snake: 1.3's game, drawn on a sandstone canvas, with its best score kept in the app's own folder (note 0026, section 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The window is a library, tested on the host with sandstone's harness against a pretend
# folder; the program is the event loop around it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "snake"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-draw = { path = "../../lib/draw" }
pbr-font = { path = "../../lib/font" }
pbr-sandstone = { path = "../../lib/sandstone" }
pbr-snake = { path = "../../lib/snake" }

[target.'cfg(target_os = "prettybigrock")'.dependencies]
pbr-files = { path = "../../lib/files" }
pbr-granite = { path = "../../lib/granite" }
pbr-window = { path = "../../lib/window" }

[dev-dependencies]
pbr-sandstone = { path = "../../lib/sandstone", features = ["testing"] }

[lints]
workspace = true
