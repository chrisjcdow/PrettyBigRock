# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "pbr-notepad"
description = "Notepad: 1.3's text editor, opening and saving text files through the file picker (note 0026, section 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The window is a library, tested on the host with sandstone's harness against a pretend disk
# and file picker; the program is the event loop around it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "notepad"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-crc = { path = "../../lib/crc" }
pbr-sandstone = { path = "../../lib/sandstone" }
pbr-window = { path = "../../lib/window" }

[target.'cfg(target_os = "prettybigrock")'.dependencies]
pbr-files = { path = "../../lib/files" }
pbr-granite = { path = "../../lib/granite" }
pbr-interfaces = { path = "../../lib/interfaces" }

[dev-dependencies]
pbr-sandstone = { path = "../../lib/sandstone", features = ["testing"] }

[lints]
workspace = true
