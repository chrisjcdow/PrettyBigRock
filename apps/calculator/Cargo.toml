# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "pbr-calculator"
description = "Calculator: 1.3's calculator as a sandstone app, with lib/calc doing the sums (note 0026, section 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The window is a library, tested on the host with sandstone's harness; the program is the
# event loop around it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "calculator"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-calc = { path = "../../lib/calc" }
pbr-draw = { path = "../../lib/draw" }
pbr-font = { path = "../../lib/font" }
pbr-sandstone = { path = "../../lib/sandstone" }

[target.'cfg(target_os = "prettybigrock")'.dependencies]
pbr-granite = { path = "../../lib/granite" }
pbr-files = { path = "../../lib/files" }
pbr-window = { path = "../../lib/window" }

[dev-dependencies]
pbr-sandstone = { path = "../../lib/sandstone", features = ["testing"] }

[lints]
workspace = true
