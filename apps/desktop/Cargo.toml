[package]
name = "pbr-desktop-app"
description = "The session's desktop: wallpaper, taskbar, start menu and app icons, launching apps through the sandbox manager (note 0024, section 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "desktop"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-desktop = { path = "../../lib/desktop" }
pbr-draw = { path = "../../lib/draw" }
pbr-files = { path = "../../lib/files" }
pbr-granite = { path = "../../lib/granite" }
pbr-interfaces = { path = "../../lib/interfaces" }
pbr-manifest = { path = "../../lib/manifest" }
pbr-window = { path = "../../lib/window" }

[lints]
workspace = true
