# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "pbr-about"
description = "About PrettyBigRock: the logo, the version, and the display, memory, uptime and disk, read through pbr.sysinfo (note 0026, section 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The window is a library, tested on the host with sandstone's harness against a pretend
# pbr.sysinfo; the program is the event loop around it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "about"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-desktop = { path = "../../lib/desktop" }
pbr-draw = { path = "../../lib/draw" }
pbr-interfaces = { path = "../../lib/interfaces" }
pbr-sandstone = { path = "../../lib/sandstone" }

[target.'cfg(target_os = "prettybigrock")'.dependencies]
pbr-files = { path = "../../lib/files" }
pbr-granite = { path = "../../lib/granite" }
pbr-window = { path = "../../lib/window" }

[dev-dependencies]
pbr-sandstone = { path = "../../lib/sandstone", features = ["testing"] }

[lints]
workspace = true
