# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "pbr-files-app"
description = "Files: 1.3's file manager, with places, sizes and dates, and Open with... (note 0026, section 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The window is a library, tested on the host with sandstone's harness against a tree in
# memory and a pretend launcher; the program is the event loop around it. (The crate is not
# called `pbr-files`: that is `lib/files`, which holds a program's file tree.)
[lib]
path = "src/lib.rs"

[[bin]]
name = "files"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-browse = { path = "../../lib/browse" }
pbr-sandstone = { path = "../../lib/sandstone" }

[target.'cfg(target_os = "prettybigrock")'.dependencies]
pbr-files = { path = "../../lib/files" }
pbr-granite = { path = "../../lib/granite" }
pbr-interfaces = { path = "../../lib/interfaces" }
pbr-manifest = { path = "../../lib/manifest" }
pbr-window = { path = "../../lib/window" }

[dev-dependencies]
pbr-sandstone = { path = "../../lib/sandstone", features = ["testing"] }
pbr-window = { path = "../../lib/window" }

[lints]
workspace = true
