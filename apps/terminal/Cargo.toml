# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "pbr-terminal-app"
description = "Terminal: 1.3's Terminal as a window, running the same shell as the text shell (note 0026, section 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The window is a library, tested on the host with sandstone's harness and a pretend shell on
# the other side of its queue; the program is the event loop and the shell's thread around it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "terminal"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-draw = { path = "../../lib/draw" }
pbr-granite = { path = "../../lib/granite" }
pbr-sandstone = { path = "../../lib/sandstone" }
pbr-shell = { path = "../../lib/shell" }
pbr-terminal = { path = "../../lib/terminal" }

[target.'cfg(target_os = "prettybigrock")'.dependencies]
pbr-files = { path = "../../lib/files" }
pbr-interfaces = { path = "../../lib/interfaces" }
pbr-window = { path = "../../lib/window" }

[dev-dependencies]
pbr-interfaces = { path = "../../lib/interfaces" }
pbr-sandstone = { path = "../../lib/sandstone", features = ["testing"] }
pbr-window = { path = "../../lib/window" }

[lints]
workspace = true
