[package]
name = "pbr-rockfs-server"
description = "The RockFS filesystem server: lib/rockfs served through lib/fsserve"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rockfs"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pbr-granite = { path = "../../lib/granite" }
pbr-interfaces = { path = "../../lib/interfaces" }
pbr-fs = { path = "../../lib/fs" }
pbr-fsserve = { path = "../../lib/fsserve" }
pbr-rockfs = { path = "../../lib/rockfs" }

[lints]
workspace = true
