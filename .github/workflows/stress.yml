# SPDX-License-Identifier: GPL-3.0-or-later
# Boots every configuration many times, to catch problems that only show up now and then (a
# race between cores, a restart that is sometimes too slow). Run by hand from the Actions tab:
# each of the parallel jobs runs `cargo xtask qemu-test` the number of times asked for, so the
# total is jobs × runs boots of each kind (the self-test and the desktop boot) of each of the
# four configurations.
name: Stress

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Boot test runs in each job"
        default: "5"
        required: true

jobs:
  stress:
    name: Stress (job ${{ matrix.job }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and its UEFI firmware, and the FAT32 tools the tests check with
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 dosfstools mtools
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - name: Build once
        run: cargo xtask build
      - name: Boot every configuration again and again
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          for i in $(seq 1 "$RUNS"); do
            echo "::group::Run $i of $RUNS"
            cargo xtask qemu-test || { echo "::endgroup::"; echo "Run $i failed"; exit 1; }
            echo "::endgroup::"
          done
      - name: Keep the boot test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs-${{ matrix.job }}
          path: |
            build/qemu/serial-*.txt
            build/qemu/desktop-*.txt
