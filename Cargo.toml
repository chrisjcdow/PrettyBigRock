#
# The PrettyBigRock 2 workspace. See docs/design/0001-repository-layout.md.
# The 1.x system (C) lives in classic/ and is built with classic/build.sh.

[workspace]
resolver = "3"
members = [
    "apps/shell",
    "boot/bios",
    "boot/common",
    "boot/uefi",
    "drivers/framebuffer",
    "drivers/ps2",
    "drivers/serial16550",
    "drivers/virtio-blk",
    "drivers/virtio-gpu",
    "drivers/virtio-input",
    "kernel",
    "lib/archive",
    "lib/blockcache",
    "lib/bootinfo",
    "lib/captree",
    "lib/crc",
    "lib/devices",
    "lib/draw",
    "lib/driver",
    "lib/elf",
    "lib/fat",
    "lib/filetree",
    "lib/font",
    "lib/files",
    "lib/fs",
    "lib/fsserve",
    "lib/fsserve",
    "lib/granite",
    "lib/interface-compiler",
    "lib/interfaces",
    "lib/keymap",
    "lib/manifest",
    "lib/partition",
    "lib/platform",
    "lib/ranges",
    "lib/rockfs",
    "lib/shell",
    "lib/supervise",
    "lib/terminal",
    "lib/testpng",
    "lib/virtio",
    "services/console",
    "services/devmgr",
    "services/fat",
    "services/root",
    "services/rockfs",
    "services/sandbox",
    "services/storage",
    "services/users",
    "tests/programs/echo",
    "tests/programs/fileprobe",
    "tests/programs/memfs",
    "tests/programs/probe",
    "tests/programs/protocol",
    "tests/programs/sandboxed",
    "tools/rockfs-rs",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Christopher Cameron-Dow", "Claude (Anthropic)"]
repository = "https://github.com/chrisjcdow/PrettyBigRock"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Programs are built for PrettyBigRock's own targets (targets/), whose target_os is ours.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("prettybigrock"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

# Drawing is built optimised even in test (debug) builds: the boot tests run x86-64 emulated on
# a busy machine, where unoptimised pixel loops make the screen far too slow to test the desktop
# (note 0026, section 6). Debug assertions and overflow checks stay on, since they are set for
# the whole profile, not per package. M6 adds the display server here when it is written.
[profile.dev.package.pbr-font]
opt-level = 2

[profile.dev.package.pbr-terminal]
opt-level = 2

[profile.dev.package.pbr-draw]
opt-level = 2

# The display rules and pixel conversion, and the framebuffer driver's copying: every pixel
# of every picture goes through them.
[profile.dev.package.pbr-devices]
opt-level = 2

[profile.dev.package.pbr-driver-framebuffer]
opt-level = 2

[profile.dev.package.pbr-driver-virtio-gpu]
opt-level = 2

# The start-up archive's checksum covers all of it (some tens of megabytes of programs), and
# every program that reads the archive checks it: the device manager, the users service, each
# sandbox manager, the input service. Unoptimised and emulated, that one loop took the device
# manager most of the 20 to 30 seconds it needed to start (found in M6, stage 4).
[profile.dev.package.pbr-archive]
opt-level = 2

[profile.release]
panic = "abort"
debug = true
