#
# The PrettyBigRock 2 workspace. See docs/design/0001-repository-layout.md.
# The 1.x system (C) lives in classic/ and is built with classic/build.sh.

[workspace]
resolver = "3"
members = [
    "boot/bios",
    "boot/common",
    "boot/uefi",
    "drivers/framebuffer",
    "drivers/ps2",
    "drivers/serial16550",
    "drivers/virtio-blk",
    "drivers/virtio-input",
    "kernel",
    "lib/archive",
    "lib/blockcache",
    "lib/bootinfo",
    "lib/captree",
    "lib/crc",
    "lib/devices",
    "lib/driver",
    "lib/elf",
    "lib/fat",
    "lib/filetree",
    "lib/files",
    "lib/fs",
    "lib/fsserve",
    "lib/fsserve",
    "lib/granite",
    "lib/interface-compiler",
    "lib/interfaces",
    "lib/manifest",
    "lib/partition",
    "lib/platform",
    "lib/ranges",
    "lib/rockfs",
    "lib/supervise",
    "lib/virtio",
    "services/devmgr",
    "services/fat",
    "services/root",
    "services/rockfs",
    "services/sandbox",
    "services/storage",
    "services/users",
    "tests/programs/echo",
    "tests/programs/fileprobe",
    "tests/programs/memfs",
    "tests/programs/probe",
    "tests/programs/protocol",
    "tests/programs/sandboxed",
    "tools/rockfs-rs",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Christopher Cameron-Dow", "Claude (Anthropic)"]
repository = "https://github.com/chrisjcdow/PrettyBigRock"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Programs are built for PrettyBigRock's own targets (targets/), whose target_os is ours.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("prettybigrock"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
