#
# The PrettyBigRock 2 workspace. See docs/design/0001-repository-layout.md.
# The 1.x system (C) lives in classic/ and is built with classic/build.sh.

[workspace]
resolver = "3"
members = [
    "boot/bios",
    "boot/common",
    "boot/uefi",
    "kernel",
    "lib/archive",
    "lib/bootinfo",
    "lib/captree",
    "lib/elf",
    "lib/granite",
    "lib/platform",
    "services/root",
    "tests/programs/echo",
    "tests/programs/probe",
    "tests/programs/protocol",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Christopher Cameron-Dow", "Claude (Anthropic)"]
repository = "https://github.com/chrisjcdow/PrettyBigRock"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# Programs are built for PrettyBigRock's own targets (targets/), whose target_os is ours.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("prettybigrock"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
